appId: com.personaleditor.app
productName: Personal Editor
copyright: Personal use
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: build/after-pack.cjs
extraResources:
  - from: build/icon.png
    to: icon.png
fileAssociations:
  - ext: ped
    name: Personal Editor Document
    description: Personal Editor Document
    role: Editor
win:
  icon: build/icon.png
  artifactName: Personal-Editor-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Personal Editor
  uninstallDisplayName: Personal Editor
  artifactName: Personal-Editor-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: Personal-Editor-Portable-${version}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  artifactName: Personal-Editor-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Personal Editor ${version}
linux:
  icon: build/icon.png
  target: [dir]
  category: Office

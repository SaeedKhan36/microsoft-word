name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build installer, portable app and zip
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Launch the built app and check it opens
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\Personal Editor.exe'
          $out = Join-Path $env:RUNNER_TEMP 'autotest.json'
          $env:PE_AUTOTEST = Join-Path $PWD 'scripts\dbg.js'
          $env:PE_AUTOTEST_OUT = $out
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'The app did not finish its start-up check in time.' }
          if (-not (Test-Path $out)) { throw 'The app did not start correctly (no test result was written).' }
          $r = Get-Content $out -Raw
          Write-Host "Start-up check: $r"
          if ($r -notmatch '"ok":true') { throw "The app reported a problem: $r" }

      - uses: actions/upload-artifact@v4
        with:
          name: personal-editor-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Publish the download page (GitHub release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release delete $tag --yes --cleanup-tag 2>$null
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object { $_.FullName }
          gh release create $tag @files --title "Personal Editor $version" --notes "Windows build of Personal Editor $version. Download Personal-Editor-Setup-$version.exe and run it. If Windows shows 'Windows protected your PC', click More info, then Run anyway."
